<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tlias智能学习辅助系统</title>
  <style>
    /* 搜索表单区域 */
    .search-form {
      display: flex;
      align-items: center;
      padding: 20px;
    }

    /* 表单控件样式 */
    .search-form input[type="text"],
    .search-form select {
      margin-right: 10px;
      padding: 10px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 26%;
    }

    /* 按钮样式 */
    .search-form button {
      padding: 10px 15px;
      margin-left: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 清空按钮样式 */
    .search-form button.clear {
      background-color: #6c757d;
    }

    .table {
      min-width: 100%;
      border-collapse: collapse;
    }

    /* 设置表格单元格边框 */
    .table td,
    .table th {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    .avatar {
      width: 30px;
      height: 30px;
      object-fit: cover;
      border-radius: 50%;
    }
  </style>
</head>

<body>

  <div id="container">
    {{searchEmp}}
    <!-- 搜索表单区域 -->
    <form class="search-form" action="#" method="post">
      <input type="text" placeholder="姓名" v-model="searchEmp.name" />

      <select v-model="searchEmp.gender">
        <option value="">性别</option>
        <option value="1">男</option>
        <option value="2">女</option>
      </select>

      <select v-model="searchEmp.job">
        <option value="">职位</option>
        <option value="1">班主任</option>
        <option value="2">讲师</option>
        <option value="3">学工主管</option>
        <option value="4">教研主管</option>
        <option value="5">咨询师</option>
      </select>

      <button type="button" @click="search">查询</button>
      <button type="button" @click="clear">清空</button>
    </form>

    <table class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>序号</th>
          <th>姓名</th>
          <th>性别</th>
          <th>头像</th>
          <th>职位</th>
          <th>入职日期</th>
          <th>最后操作时间</th>
          <th>操作</th>
        </tr>
      </thead>
      {{empList}}
      <tbody>
        <tr v-for="(item, index) in empList" :key="index">
          <th>{{item.id}}</th>
          <th>{{item.name}}</th>
          <th>{{item.gender}}</th>
          <td><img :src="item.image" class="avatar"></td>
          <td>
            <span v-if="item.job == 1">班主任</span>
            <span v-else-if="item.job == 2">讲师</span>
            <span v-else-if="item.job == 3">学工主管</span>
            <span v-else-if="item.job == 4">教研主管</span>
            <span v-else-if="item.job == 5">咨询师</span>
            <span v-else>其他</span>
          </td>
          <td>{{item.entrydate}}</td>
          <td>{{item.updatetime}}</td>
          <td class="btn-group">
            <button class="edit">编辑</button>
            <button class="delete">删除</button>
          </td>
        </tr>
      </tbody>
    </table>

  </div>

  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

    createApp({
      data() {
        return {
          //搜索条件封装数据
          searchEmp: {
            name: '',
            gender: '',
            job: ''
          },
          //员工列表数据
          empList: []
        }
      },
      methods: {
        search() {

          const params = {
            name: this.searchEmp.name,
            gender: this.searchEmp.gender,
            job: this.searchEmp.job
          };

          axios.get('https://web-server.itheima.net/emps/list', { params }).then((result) => {
            this.empList = result.data.data
          }).catch((err) => {

          });
        },

        clear() {
          this.searchEmp = {
            name: '',
            gender: '',
            job: ''
          };
          this.search();
        }
      },
      mounted() { //Vue挂载完毕后自动触发
        this.search()
      }
    }).mount('#container')
  </script>
</body>

</html>
