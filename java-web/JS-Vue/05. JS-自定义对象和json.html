<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-自定义对象和json</title>
</head>
<body>

   <script>
        //1. 自定义JS对象
        // 创建一个对象
        
        //2. JSON对象
        // 创建一个JSON对象
        //3. JSON - JS对象标记法
        let person = {
          name: 'itcast',
          age: 18,
          gender: '男'
        }
        alert(JSON.stringify(person)); //js对象 --> json字符串

        let personJson = '{"name": "heima", "age": 18}';
        alert(JSON.parse(personJson).name);
    </script>
</body>
</html>
